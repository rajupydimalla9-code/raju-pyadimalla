    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Venkatesh </title>
<style>
  :root{
    --pink:#ff4f8b;
    --gold:#ffd166;
    --purple:#6c3cff;
    --dark:#120c2c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:white;
    background:
      radial-gradient(circle at 20% 20%,rgba(255,79,139,.35),transparent 28%),
      radial-gradient(circle at 80% 20%,rgba(108,60,255,.35),transparent 25%),
      linear-gradient(160deg,#0c0820,#24114d 55%,#120c2c);
  }
  .wrap{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:22px;
    position:relative;
    z-index:2;
  }
  .card{
    width:min(920px,100%);
    text-align:center;
    padding:28px 18px 36px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:28px;
    background:rgba(255,255,255,.09);
    backdrop-filter:blur(12px);
    box-shadow:0 20px 70px rgba(0,0,0,.35);
  }
  .title{
    font-size:clamp(2rem,7vw,4.8rem);
    line-height:1.05;
    margin:10px 0 8px;
    background:linear-gradient(90deg,#fff,#ffd166,#ff8fab,#fff);
    background-size:220% auto;
    color:transparent;
    -webkit-background-clip:text;
    background-clip:text;
    animation:shine 4s linear infinite;
  }
  @keyframes shine{to{background-position:220% center}}
  .sub{
    font-size:clamp(1rem,2.5vw,1.35rem);
    opacity:.9;
    margin-bottom:20px;
  }
  .photo-frame{
    width:min(320px,78vw);
    aspect-ratio:4/5;
    margin:0 auto 24px;
    border-radius:28px;
    padding:7px;
    background:linear-gradient(135deg,var(--gold),var(--pink),var(--purple));
    box-shadow:0 18px 50px rgba(255,79,139,.28);
    transform:translateY(14px) scale(.96);
    opacity:0;
    transition:.9s ease;
  }
  .started .photo-frame{transform:none;opacity:1}
  .photo-frame img{
    width:100%;height:100%;object-fit:cover;border-radius:22px;
    display:block;background:#20183f;
  }
  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button,.upload-label{
    border:0;
    border-radius:999px;
    padding:13px 21px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    color:#170d2f;
    background:linear-gradient(90deg,#ffd166,#ffb703);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.2s ease;
  }
  button:hover,.upload-label:hover{transform:translateY(-2px)}
  #photoInput{display:none}
  .cake-area{margin:34px auto 16px;width:240px;height:230px;position:relative}
  .cake{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:190px;height:120px;border-radius:22px 22px 14px 14px;
    background:linear-gradient(#ffb3c7,#ff6f91);
    box-shadow:inset 0 -18px rgba(150,35,75,.12),0 15px 35px rgba(0,0,0,.28);
    transition:1s ease;
  }
  .cake:before{
    content:"";position:absolute;left:0;right:0;top:0;height:34px;
    border-radius:22px 22px 45% 45%;
    background:#fff3d6;
  }
  .layer{
    position:absolute;left:15px;right:15px;bottom:22px;height:22px;
    border-radius:20px;background:#fff3d6;
  }
  .candle{
    position:absolute;left:50%;top:-48px;transform:translateX(-50%);
    width:15px;height:50px;border-radius:6px;
    background:repeating-linear-gradient(45deg,#6c3cff 0 6px,#fff 6px 12px);
  }
  .flame{
    position:absolute;left:50%;top:-25px;transform:translateX(-50%);
    width:17px;height:27px;border-radius:50% 50% 45% 45%;
    background:radial-gradient(circle at 50% 70%,#fff 0 18%,#ffd166 25%,#ff7b00 70%);
    filter:drop-shadow(0 0 12px #ffd166);
    animation:flicker .18s infinite alternate;
  }
  @keyframes flicker{to{transform:translateX(-50%) scale(.88) rotate(4deg)}}
  .knife{
    position:absolute;width:145px;height:13px;border-radius:12px;
    right:-10px;top:58px;background:linear-gradient(90deg,#e7edf8,#9fa8bd);
    transform:rotate(-18deg) translateX(55px);opacity:0;transition:.7s ease;
  }
  .knife:after{
    content:"";position:absolute;right:-35px;top:-6px;width:48px;height:25px;
    border-radius:10px;background:#6c3cff;
  }
  .cut .knife{opacity:1;transform:rotate(-18deg) translateX(0)}
  .cut .cake{clip-path:polygon(0 0,46% 0,46% 100%,0 100%,0 0,54% 0,100% 0,100% 100%,54% 100%)}
  .message{
    font-size:clamp(1.05rem,2.6vw,1.4rem);
    line-height:1.6;
    max-width:650px;margin:22px auto 0;
    opacity:0;transform:translateY(14px);transition:1s ease .4s;
  }
  .cut .message{opacity:1;transform:none}
  .hint{opacity:.7;font-size:.9rem;margin-top:14px}
  .balloon{
    position:fixed;bottom:-150px;width:55px;height:70px;border-radius:50% 50% 45% 45%;
    opacity:.85;animation:float 9s linear infinite;z-index:1;
  }
  .balloon:after{content:"";position:absolute;left:50%;top:68px;width:2px;height:90px;background:rgba(255,255,255,.5)}
  @keyframes float{to{transform:translateY(-125vh) rotate(12deg)}}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
  @media(max-width:560px){
    .card{padding-top:20px}
    .cake-area{transform:scale(.9);margin-top:20px}
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="balloons"></div>

<div class="wrap" id="wrap">
  <main class="card">
    <h1 class="title">🎉 Happy Birthday<br>Venkatesh అన్నయ్య 🎉</h1>
    <div class="sub">May your special day be filled with happiness and smiles ❤️</div>

    <div class="photo-frame">
      <img id="broPhoto" alt="Venkatesh అన్నయ్య photo"
           src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='1000'%3E%3Crect width='100%25' height='100%25' fill='%2320183f'/%3E%3Ctext x='50%25' y='48%25' fill='white' font-size='42' text-anchor='middle' font-family='Arial'%3EVenkatesh అన్నయ్య%3C/text%3E%3Ctext x='50%25' y='55%25' fill='%23ffd166' font-size='28' text-anchor='middle' font-family='Arial'%3EChoose a photo below%3C/text%3E%3C/svg%3E"/>
    </div>

    <div class="controls">
      <button id="startBtn">🎵 Start Celebration</button>
      <label class="upload-label" for="photoInput">📷 Add Photo</label>
      <input id="photoInput" type="file" accept="image/*">
    </div>

    <section class="cake-area">
      <div class="cake">
        <div class="layer"></div>
        <div class="candle"><div class="flame"></div></div>
      </div>
      <div class="knife"></div>
    </section>

    <button id="cutBtn">🎂 Cut the Cake</button>

    <div class="message">
      <strong>Happy Birthday Venkatesh అన్నయ్య!</strong><br>
      May your life be filled with happiness, good health, and success.<br>
      Wishing you a truly wonderful year ahead! ❤️
    </div>
    <div class="hint">Add the photo first, then tap Start Celebration.</div>
  </main>
</div>

<script>
const wrap = document.getElementById('wrap');
const startBtn = document.getElementById('startBtn');
const cutBtn = document.getElementById('cutBtn');
const photoInput = document.getElementById('photoInput');
const broPhoto = document.getElementById('broPhoto');
let audioCtx, musicTimer, started = false;

photoInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    broPhoto.src = reader.result;
    try {
      localStorage.setItem('venkateshPhoto', reader.result);
    } catch (error) {
      console.warn('The photo is visible now, but the browser could not save it permanently.', error);
    }
  };
  reader.readAsDataURL(file);
});

let savedPhoto = null;
try {
  savedPhoto = localStorage.getItem('venkateshPhoto');
} catch (error) {
  console.warn('Saved photo could not be loaded.', error);
}
if(savedPhoto) broPhoto.src = savedPhoto;

let musicPlaying = false;
let nextNoteTime = 0;
let currentNote = 0;
let schedulerTimer = null;

const melody = [
  [392,.28],[392,.18],[440,.5],[392,.5],[523,.5],[494,.9],
  [392,.28],[392,.18],[440,.5],[392,.5],[587,.5],[523,.9],
  [392,.28],[392,.18],[784,.5],[659,.5],[523,.5],[494,.5],[440,.8],
  [698,.28],[698,.18],[659,.5],[523,.5],[587,.5],[523,.9]
];

function scheduleNote(freq, start, duration){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(.0001, start);
  gain.gain.exponentialRampToValueAtTime(.16, start + .03);
  gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + duration + .04);
}

function musicScheduler(){
  while(musicPlaying && nextNoteTime < audioCtx.currentTime + .4){
    const [freq, duration] = melody[currentNote];
    scheduleNote(freq, nextNoteTime, duration);
    nextNoteTime += duration;
    currentNote = (currentNote + 1) % melody.length;
  }
}

function startMusic(){
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
  currentNote = 0;
  nextNoteTime = audioCtx.currentTime + .05;
  clearInterval(schedulerTimer);
  schedulerTimer = setInterval(musicScheduler, 100);
  musicScheduler();
}

function stopMusic(){
  musicPlaying = false;
  clearInterval(schedulerTimer);
  schedulerTimer = null;
}

function makeBalloons(){
  const box = document.getElementById('balloons');
  const palette = ['#ff4f8b','#ffd166','#6c3cff','#5eead4','#60a5fa'];
  for(let i=0;i<14;i++){
    const b=document.createElement('div');
    b.className='balloon';
    b.style.left=(Math.random()*100)+'vw';
    b.style.background=palette[i%palette.length];
    b.style.animationDelay=(Math.random()*7)+'s';
    b.style.animationDuration=(7+Math.random()*6)+'s';
    box.appendChild(b);
  }
}

startBtn.addEventListener('click',()=>{
  if(!started){
    makeBalloons();
    started = true;
    wrap.classList.add('started');
    burstConfetti(180);
  }

  if(musicPlaying){
    stopMusic();
    startBtn.textContent = '▶ Resume Music';
  } else {
    startMusic();
    startBtn.textContent = '⏸ Pause Music';
  }
});

cutBtn.addEventListener('click',()=>{
  wrap.classList.add('cut');
  burstConfetti(260);
  cutBtn.textContent='🎉 Happy Birthday!';
});

const canvas=document.getElementById('confetti');
const ctx=canvas.getContext('2d');
let pieces=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

function burstConfetti(count){
  for(let i=0;i<count;i++){
    pieces.push({
      x:innerWidth/2,y:innerHeight*.3,
      vx:(Math.random()-.5)*12,
      vy:(Math.random()*-10)-4,
      g:.22+Math.random()*.12,
      s:4+Math.random()*7,
      r:Math.random()*Math.PI,
      vr:(Math.random()-.5)*.35,
      life:120+Math.random()*80
    });
  }
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.fillStyle=`hsl(${(i*47)%360} 90% 60%)`;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.65);
    ctx.restore();
  });
  pieces=pieces.filter(p=>p.life>0 && p.y<innerHeight+50);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
